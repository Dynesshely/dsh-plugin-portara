<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-label="dsh-plugin-portara — gateway routing shown in the DeepSeek Harness chat stream">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#070d18"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="-0.05" r="0.75">
      <stop offset="0" stop-color="#4d8dff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4d8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.95" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.62" cy="1.05" r="0.7">
      <stop offset="0" stop-color="#56d9f0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#56d9f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8ea3c9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbcff"/>
      <stop offset="1" stop-color="#2f6de0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d8dff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4d8dff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#glowBlue)"/>
  <rect width="1600" height="480" fill="url(#glowViolet)"/>
  <rect width="1600" height="480" fill="url(#glowCyan)"/>
  <rect width="1600" height="480" fill="url(#grid)" opacity="0.85"/>

  <!-- ── left: identity ─────────────────────────────────────────────── -->
  <g font-family="DejaVu Sans, Segoe UI, sans-serif">
    <rect x="72" y="70" width="292" height="34" rx="17" fill="#4d8dff" fill-opacity="0.12" stroke="#4d8dff" stroke-opacity="0.45"/>
    <circle cx="92" cy="87" r="4" fill="#7db1ff"/>
    <text x="106" y="93" font-size="13" letter-spacing="1.6" fill="#a8c4f2">DSH BUNDLE · HOST + CLIENT</text>

    <text x="70" y="200" font-size="66" font-weight="700" fill="#eef3ff">dsh-plugin-portara</text>
    <rect x="72" y="224" width="310" height="4" rx="2" fill="url(#rule)"/>

    <text x="72" y="276" font-size="21" fill="#c3d2ee">Show where each reply was actually served.</text>
    <text x="72" y="308" font-size="21" fill="#93a7c8">Channel, account, upstream model — as a chat row.</text>

    <g font-size="14" fill="#9fb3d4">
      <rect x="72" y="348" width="186" height="34" rx="9" fill="#111a2c" stroke="#8ea3c9" stroke-opacity="0.22"/>
      <path d="M90 357l-6 11h7l-1 9 10-14h-7z" fill="url(#bolt)"/>
      <text x="110" y="370">route card</text>

      <rect x="270" y="348" width="214" height="34" rx="9" fill="#111a2c" stroke="#8ea3c9" stroke-opacity="0.22"/>
      <circle cx="290" cy="365" r="5.5" fill="none" stroke="#56d9f0" stroke-width="2"/>
      <path d="M290 358.5v6.5l4 3" stroke="#56d9f0" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="308" y="370">failover history</text>

      <rect x="496" y="348" width="228" height="34" rx="9" fill="#111a2c" stroke="#8ea3c9" stroke-opacity="0.22"/>
      <path d="M514 357l7 7-7 7" stroke="#4ade80" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="532" y="370">silent by contract</text>
    </g>
  </g>

  <!-- ── right: gateway fan-out + the rendered row ──────────────────── -->
  <g>
    <rect x="872" y="52" width="664" height="376" rx="22" fill="#0b1322" fill-opacity="0.72" stroke="#8ea3c9" stroke-opacity="0.16"/>

    <g font-family="DejaVu Sans, Segoe UI, sans-serif">
      <rect x="900" y="84" width="184" height="42" rx="12" fill="#101a2d" stroke="#4d8dff" stroke-opacity="0.42"/>
      <circle cx="922" cy="105" r="5" fill="#4d8dff"/>
      <text x="936" y="110" font-size="14" fill="#c3d2ee">portara gateway</text>
      <text x="900" y="146" font-size="12" letter-spacing="1.2" fill="#7186a8">/v1/route-info</text>
    </g>

    <g stroke="#8ea3c9" stroke-opacity="0.34" fill="none" stroke-width="1.6">
      <path d="M1084 105C1146 105 1146 104 1196 104"/>
      <path d="M1084 105C1146 105 1146 160 1196 160"/>
      <path d="M1084 105C1146 105 1146 216 1196 216"/>
    </g>

    <g font-family="DejaVu Sans, Segoe UI, sans-serif" font-size="13">
      <rect x="1200" y="84" width="304" height="40" rx="11" fill="#12305a" stroke="#4d8dff" stroke-opacity="0.7"/>
      <circle cx="1220" cy="104" r="4.5" fill="#7db1ff"/>
      <text x="1234" y="109" fill="#e8f0ff">OpenDesign</text>
      <text x="1404" y="109" fill="#a8c4f2" text-anchor="end">ACP-003</text>
      <text x="1488" y="109" fill="#7db1ff" font-size="11" letter-spacing="1" text-anchor="end">ACTIVE</text>

      <rect x="1200" y="140" width="304" height="40" rx="11" fill="#0e1727" stroke="#8ea3c9" stroke-opacity="0.2"/>
      <circle cx="1220" cy="160" r="4.5" fill="#5b6d8c"/>
      <text x="1234" y="165" fill="#8ea3c9">CommandCode</text>
      <text x="1404" y="165" fill="#6d7f9d" text-anchor="end">ACP-002</text>
      <text x="1488" y="165" fill="#fbbf24" font-size="11" letter-spacing="1" text-anchor="end">429</text>

      <rect x="1200" y="196" width="304" height="40" rx="11" fill="#0e1727" stroke="#8ea3c9" stroke-opacity="0.2"/>
      <circle cx="1220" cy="216" r="4.5" fill="#5b6d8c"/>
      <text x="1234" y="221" fill="#8ea3c9">DeepSeek</text>
      <text x="1404" y="221" fill="#6d7f9d" text-anchor="end">ACP-001</text>
      <text x="1488" y="221" fill="#6d7f9d" font-size="11" letter-spacing="1" text-anchor="end">IDLE</text>
    </g>

    <!-- the rendered conversation row -->
    <g font-family="DejaVu Sans, Segoe UI, sans-serif">
      <rect x="900" y="264" width="604" height="136" rx="14" fill="#101a2d" stroke="#8ea3c9" stroke-opacity="0.2"/>
      <rect x="918" y="280" width="28" height="28" rx="8" fill="#4d8dff" fill-opacity="0.16"/>
      <path d="M931 286l-4.5 8.5h5.5l-1 7.5 8-10.5h-5.5z" fill="url(#bolt)"/>
      <text x="960" y="299" font-size="15" fill="#e8f0ff">Routed to OpenDesign / ACP-003</text>
      <text x="1482" y="299" font-size="13" fill="#93a7c8" text-anchor="end">deepseek-v4.1-flash</text>

      <line x1="918" y1="322" x2="1486" y2="322" stroke="#8ea3c9" stroke-opacity="0.14"/>

      <text x="918" y="346" font-size="12.5" fill="#93a7c8">Attempt 1 · CommandCode / ACP-002 · quota cooldown · HTTP 429</text>
      <text x="918" y="372" font-size="12.5" fill="#6d7f9d">Attempt 2 · OpenDesign / ACP-003 · failover succeeded</text>
    </g>
  </g>
</svg>
